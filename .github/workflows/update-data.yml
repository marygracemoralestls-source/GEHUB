name: Update hub data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reader
        run: pip install openpyxl

      - name: Download the tracker
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
        run: |
          curl -L --fail --silent --show-error -o tracker.xlsx "$TRACKER_URL"
          python -c "import zipfile; zipfile.ZipFile('tracker.xlsx')" || { echo "The link did not return the Excel file. Check TRACKER_URL is an Anyone-with-the-link share link ending in download=1."; exit 1; }

      - name: Build data.json
        run: python build_data.py tracker.xlsx data.json

      - name: Save data.json
        run: |
          git config user.name "ge-hub-bot"
          git config user.email "ge-hub-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data.json" && git push)
